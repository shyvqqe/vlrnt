services:
  - type: web
    name: valorant-overwolf-bot
    runtime: python
    rootDir: bot
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        value: '8287059539'
      - key: BRIDGE_TOKEN
        sync: false
      - key: DB_PATH
        value: ./data/valorant.sqlite3
